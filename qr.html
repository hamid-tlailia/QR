<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./images/favicon.png">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Scan, read and generate QR codes right in your browser.">
  <title>QR Code Reader & Generator</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="qr.css">
</head>
<body>
   <h5 class="card-title w-100 text-center text-warning bg-dark  p-2 mt-0 header-title">QR Code Reader & Generator</h5>
  <div class="container-fluid d-flex flex-column align-items-center main-content p-0">

    <div class="card">
      <div class="card-body">
        <div class="btns-container">
          <button class="btn btn-outline-primary" id="startScanBtn" aria-label="Scan QR code with camera">📷 Scan</button>
          <button class="btn btn-outline-secondary" data-toggle="modal" data-target="#generateModal" aria-label="Generate a QR code">❖ Generate</button>
          <label class="btn btn-outline-warning" role="button" for="qrInput" aria-label="Read QR code from an image file">📎 Read QR</label>
        </div>
        <input class="d-none" type="file" id="qrInput" accept="image/*">
        <div id="reader" class="mt-3"></div>
        <div id="qr-parent" class="mt-3 card d-none">
          <div class="card-header w-100 text-center text-primary fs-3">
            <h4 class="m-0">QR code result</h4>
          </div>
          <div class="card-body">
            <p id="qr-result" class="mt-3">...</p>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center gap-4 w-100">
            <a id="browseButton" class="btn btn-outline-primary disabled" target="_blank" rel="noopener noreferrer" role="button" aria-label="Open link in a new tab">🌐 Browse</a>
            <button id="copyButton" class="btn btn-outline-secondary" aria-label="Copy result text">🔗 Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Code Reader Modal -->
  <div class="modal fade" id="scanModal" data-backdrop="static" tabindex="-1"  aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="scanModalLabel">Scan QR Code</h5>
        </div>
        <div class="modal-body">
          <div id="readerModal"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger" id="stopScanBtn" aria-label="Stop scanning">⌦</button>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Code Generator Modal -->
  <div class="modal fade" id="generateModal" tabindex="-1" aria-labelledby="generateModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="generateModalLabel">Generate QR Code</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <input type="text" id="qrText" class="form-control" placeholder="Enter text to generate QR code">
          <div id="qrCode" class="mt-3"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-success" id="generateBtn" aria-label="Generate QR code">❖ Generate</button>
          <button type="button" class="btn btn-primary disabled" id="downloadQrBtn" aria-label="Download generated QR code">⇩</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Info Modal (replaces alert()) -->
  <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4" id="infoModalBody">...</div>
        <div class="modal-footer border-0 justify-content-center pt-0">
          <button type="button" class="btn btn-outline-warning px-4" data-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

<div class="footer w-100 p-2 text-center bg-dark text-warning">
  <img class="me-2 rounded-5" style="width:40px;height:30px" src="images/favicon.png" alt="logo">
  <a href="https://hamid-tlailia-portfolio-exyv.vercel.app/" target="_blank" rel="noopener noreferrer">Hamidos.com</a>
</div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.2.0/html5-qrcode.min.js"></script>
  <script src="qr.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
