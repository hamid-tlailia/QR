<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./images/favicon.png">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Scan, read and generate QR codes right in your browser.">
  <title>QR Code Reader & Generator</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="qr.css">
</head>
<body>
  <div class="header-title w-100 p-2 mt-0 d-flex align-items-center justify-content-center gap-2">
    <img src="images/favicon.png" alt="" class="header-logo">
    <h5 class="m-0 text-warning">QR Code Reader & Generator</h5>
  </div>
  <div class="container-fluid d-flex flex-column align-items-center main-content p-0">

    <div class="card">
      <div class="card-body">
        <div class="action-grid">
          <button class="action-tile scan" id="startScanBtn" aria-label="Scan QR code with camera">
            <span class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.2"/></svg>
            </span>
            <span class="action-label">Scan</span>
          </button>
          <button class="action-tile generate" data-toggle="modal" data-target="#generateModal" aria-label="Generate a QR code">
            <span class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.2"/><path d="M15 15h2.4M19.6 15H20M15 19.6v.01M15 17.3v.01M17.3 19.6h2.7M20 17.3v2.3"/></svg>
            </span>
            <span class="action-label">Generate</span>
          </button>
          <label class="action-tile read" role="button" for="qrInput" aria-label="Read QR code from an image file">
            <span class="action-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="8.2" cy="8.4" r="1.4"/><path d="m3.5 15 4.5-4.4a2 2 0 0 1 2.7-.1L15 14.5m2.2-2.1 1-1a2 2 0 0 1 2.7 0L21 12"/></svg>
            </span>
            <span class="action-label">Read QR</span>
          </label>
        </div>
        <input class="d-none" type="file" id="qrInput" accept="image/*">
        <div id="reader" class="mt-3"></div>
        <div id="qr-parent" class="mt-3 card d-none">
          <div class="card-header w-100 d-flex align-items-center gap-2">
            <span class="result-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            <h4 class="m-0">Result</h4>
          </div>
          <div class="card-body">
            <p id="qr-result" class="mt-1">...</p>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center gap-3 w-100">
            <a id="browseButton" class="btn-icon disabled" target="_blank" rel="noopener noreferrer" role="button" aria-label="Open link in a new tab">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
              <span>Browse</span>
            </a>
            <button id="copyButton" class="btn-icon" aria-label="Copy result text">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Code Reader Modal -->
  <div class="modal fade" id="scanModal" data-backdrop="static" tabindex="-1"  aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="scanModalLabel">Scan QR Code</h5>
        </div>
        <div class="modal-body">
          <div id="readerModal"></div>
        </div>
        <div class="modal-footer justify-content-center border-0">
          <button type="button" class="stop-btn" id="stopScanBtn" aria-label="Stop scanning">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Code Generator Modal -->
  <div class="modal fade" id="generateModal" tabindex="-1" aria-labelledby="generateModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="generateModalLabel">Generate QR Code</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <input type="text" id="qrText" class="form-control" placeholder="Enter text to generate QR code">
          <div id="qrCode" class="mt-3"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-pill generate" id="generateBtn" aria-label="Generate QR code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.2"/><path d="M15 15h2.4M19.6 15H20M15 19.6v.01M15 17.3v.01M17.3 19.6h2.7M20 17.3v2.3"/></svg>
            <span>Generate</span>
          </button>
          <button type="button" class="btn-icon-round disabled" id="downloadQrBtn" aria-label="Download generated QR code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19.5h16"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Info Modal (replaces alert()) -->
  <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4" id="infoModalBody">...</div>
        <div class="modal-footer border-0 justify-content-center pt-0">
          <button type="button" class="btn btn-outline-warning px-4" data-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

<div class="footer w-100 p-2 text-center bg-dark text-warning">
  <img class="me-2 rounded-5" style="width:40px;height:30px" src="images/favicon.png" alt="logo">
  <a href="https://hamid-tlailia-portfolio-exyv.vercel.app/" target="_blank" rel="noopener noreferrer">Hamidos.com</a>
</div>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.2.0/html5-qrcode.min.js"></script>
  <script src="qr.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
