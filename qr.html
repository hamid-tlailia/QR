<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
      <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./images/favicon.png">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Scan, read and generate QR codes right in your browser.">
  <title>QR Code Reader & Generator</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="qr.css">
</head>
<body>

  <div class="views-container">

    <!-- SCAN VIEW: full-bleed live camera -->
    <div class="view" id="view-scan">
      <div class="scan-camera-box">
        <div id="readerHome"></div>
      </div>

      <div class="scan-overlay">
        <div class="scan-tagline" data-i18n="scan.tagline">Scan with privacy</div>
        <div class="viewfinder">
          <span class="vf-corner tl"></span>
          <span class="vf-corner tr"></span>
          <span class="vf-corner bl"></span>
          <span class="vf-corner br"></span>
          <span class="vf-scanline"></span>
        </div>
      </div>

      <div class="scan-controls">
        <button type="button" class="ctrl-btn d-none" id="torchBtn" data-i18n-aria="scan.torch" aria-label="Toggle flashlight">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h7l-2 7h4l-9 13 2-9H7Z"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="flipCamBtn" data-i18n-aria="scan.flip" aria-label="Switch camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2 21 6l-4 4"/><path d="M21 6H8a5 5 0 0 0-5 5v1"/><path d="M7 22 3 18l4-4"/><path d="M3 18h13a5 5 0 0 0 5-5v-1"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="rescanBtn" data-i18n-aria="scan.rescan" aria-label="Restart scanning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h5"/><path d="M4 9a8 8 0 1 1 2 5.3"/></svg>
        </button>
        <label class="ctrl-btn" role="button" for="qrInputHome" data-i18n-aria="scan.gallery" aria-label="Read QR code from an image file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="8.2" cy="8.4" r="1.4"/><path d="m3.5 15 4.5-4.4a2 2 0 0 1 2.7-.1L15 14.5m2.2-2.1 1-1a2 2 0 0 1 2.7 0L21 12"/></svg>
        </label>
        <input class="d-none" type="file" id="qrInputHome" accept="image/*">
      </div>
    </div>

    <!-- GENERATE VIEW -->
    <div class="view d-none" id="view-generate">
      <div class="view-header">
        <h5 data-i18n="tabs.generate">Generate</h5>
      </div>
      <div class="view-body">
        <div class="card generate-card">
          <div class="card-body">
            <input type="text" id="qrText" class="form-control" data-i18n-placeholder="generate.placeholder" placeholder="Enter text to generate QR code">
            <div id="qrCode" class="mt-3"></div>
            <div class="generate-actions">
              <button type="button" class="btn-pill generate" id="generateBtn" data-i18n-aria="generate.button" aria-label="Generate QR code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.2"/><path d="M15 15h2.4M19.6 15H20M15 19.6v.01M15 17.3v.01M17.3 19.6h2.7M20 17.3v2.3"/></svg>
                <span data-i18n="generate.button">Generate</span>
              </button>
              <button type="button" class="btn-icon-round disabled" id="downloadQrBtn" data-i18n-aria="generate.download" aria-label="Download generated QR code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19.5h16"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SETTINGS VIEW -->
    <div class="view d-none" id="view-settings">
      <div class="view-header">
        <h5 data-i18n="tabs.settings">Settings</h5>
      </div>
      <div class="view-body">
        <div class="settings-group">
          <div class="settings-label" data-i18n="settings.theme">Appearance</div>
          <div class="segmented" id="themeToggle">
            <button type="button" data-value="dark" class="active" data-i18n="settings.dark">Dark</button>
            <button type="button" data-value="light" data-i18n="settings.light">Light</button>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-label" data-i18n="settings.language">Language</div>
          <div class="segmented" id="langToggle">
            <button type="button" data-value="en" class="active">English</button>
            <button type="button" data-value="ar">العربية</button>
          </div>
        </div>
        <div class="settings-about">
          <img src="images/favicon.png" class="about-logo" alt="">
          <div class="about-text">
            <div class="about-name">Hamidos QR</div>
            <a href="https://hamid-tlailia-portfolio-exyv.vercel.app/" target="_blank" rel="noopener noreferrer">Hamidos.com</a>
          </div>
        </div>
      </div>
    </div>

    <!-- RESULT SHEET (overlays the scan view after a successful scan/read) -->
    <div class="result-backdrop d-none" id="resultBackdrop"></div>
    <div class="result-sheet d-none" id="resultSheet">
      <div class="result-sheet-handle"></div>
      <div class="result-sheet-header">
        <span class="result-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <h4 class="m-0" data-i18n="result.title">Result</h4>
        <button type="button" class="sheet-close" id="resultCloseBtn" data-i18n-aria="result.close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p id="qr-result">...</p>
      <div class="result-actions">
        <a id="browseButton" class="btn-icon disabled" target="_blank" rel="noopener noreferrer" role="button" data-i18n-aria="result.browse" aria-label="Open link in a new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>
          <span data-i18n="result.browse">Browse</span>
        </a>
        <button type="button" id="copyButton" class="btn-icon" data-i18n-aria="result.copy" aria-label="Copy result text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span data-i18n="result.copy">Copy</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Hidden target used only for scanning an uploaded image file -->
  <div id="readerFile" class="d-none"></div>

  <!-- BOTTOM TAB BAR -->
  <nav class="tab-bar">
    <button type="button" class="tab-btn active" data-tab="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.2"/></svg>
      <span data-i18n="tabs.scan">Scan</span>
    </button>
    <button type="button" class="tab-btn" data-tab="generate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.2"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.2"/><path d="M15 15h2.4M19.6 15H20M15 19.6v.01M15 17.3v.01M17.3 19.6h2.7M20 17.3v2.3"/></svg>
      <span data-i18n="tabs.generate">Generate</span>
    </button>
    <button type="button" class="tab-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      <span data-i18n="tabs.settings">Settings</span>
    </button>
  </nav>

  <!-- Info Modal (replaces alert()) -->
  <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-4" id="infoModalBody">...</div>
        <div class="modal-footer border-0 justify-content-center pt-0">
          <button type="button" class="btn btn-outline-warning px-4" data-dismiss="modal" data-i18n="common.ok">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.2.0/html5-qrcode.min.js"></script>
  <script src="qr.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Whether some service worker was already controlling this page before
      // this load. A first-ever install (no prior controller) has nothing
      // stale to escape, so it shouldn't force a reload — only a *replacement*
      // of an existing controller means a newer version was just installed.
      var hadController = !!navigator.serviceWorker.controller;

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (registration) {
          // Ask the browser to check for a new sw.js right now instead of
          // waiting on its own timing, so a fresh deploy is picked up on
          // this very visit rather than some indeterminate time later.
          registration.update().catch(function () {});
        }).catch(function () {});
      });

      var reloadedForNewWorker = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) {
          hadController = true;
          return;
        }
        if (reloadedForNewWorker) return;
        reloadedForNewWorker = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
